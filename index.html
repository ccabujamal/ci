:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
body {

button { font-family: inherit; }
.wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.card {

  padding: 30px 24px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.35);

.logo { text-align: center; font-size: 1.75rem; font-weight: 800; color: var(--gold); line-height: 1.35; }
.tag { text-align: center; color: #d4c4f5; margin: 8px 0 18px; font-size: .95rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; border: none; border-radius: 16px; padding: 14px 18px;
  font-weight: 800; font-size: 1.05rem; color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #ff5d90, #ff2d70);
  box-shadow: 0 8px 0 #c21650; margin-top: 12px; transition: transform .1s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #c21650; }
.btn.ghost { background: transparent; box-shadow: none; border: 2px solid rgba(255,255,255,.25); }
.btn.tiny { width: auto; padding: 9px 14px; margin: 0; font-size: .88rem; box-shadow: 0 4px 0 #c21650; }
.btn.ok { background: linear-gradient(180deg, #2ee59d, #1bbf7a); box-shadow: 0 6px 0 #0e8a55; }
.btn.sec { background: linear-gradient(180deg, #7c5cff, #5b3fd4); box-shadow: 0 6px 0 #3d2a9e; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top,0)) 16px 12px;
  background: rgba(20,6,50,.92); position: sticky; top: 0; z-index: 10; gap: 10px; flex-wrap: wrap;

.brand { font-weight: 800; font-size: 1.1rem; color: var(--gold); flex: 1; min-width: 0; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn.ghost {
  background: rgba(255,255,255,.08) !important;
  box-shadow: none !important;
  border: 2px solid rgba(255,255,255,.35) !important;
  color: #fff !important;
}
.btn.ghost:active { background: rgba(255,255,255,.15) !important; }
.page { max-width: 720px; margin: 0 auto; padding: 16px 14px 70px; }

.lang-switch { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
.lang-btn {
  padding: 8px 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,.2);
  background: rgba(0,0,0,.25); color: #fff; font-weight: 700; cursor: pointer; font-size: .92rem;
}
.lang-btn.active { border-color: var(--cyan); background: rgba(46,240,216,.18); color: var(--cyan); }

.modes { display: grid; gap: 11px; margin-top: 6px; }
.mode {
  background: rgba(0,0,0,.22); border: 2px solid rgba(255,255,255,.12);
  border-radius: 18px; padding: 15px 16px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.mode:hover, .mode.active { border-color: var(--cyan); background: rgba(46,240,216,.08); }
.mode h3 { font-size: 1.08rem; margin-bottom: 4px; }
.mode p { color: #d4c4f5; font-size: .87rem; line-height: 1.45; }

.qcard {
  background: linear-gradient(180deg, #6d35d4, #4a1d98);
  border: 3px solid var(--cyan); border-radius: 24px; padding: 22px 18px;
}
.qcard h2 { font-size: 1.22rem; margin-bottom: 16px; line-height: 1.5; }
.options { display: grid; gap: 10px; }
.option {
  background: rgba(0,0,0,.22); border: 2px solid rgba(255,255,255,.14);
  color: #fff; border-radius: 14px; padding: 13px 14px; font-weight: 700;
  cursor: pointer; transition: .15s; line-height: 1.4;
}
.option:hover:not(:disabled) { border-color: var(--cyan); }
.option.correct { background: rgba(46,229,157,.28); border-color: var(--ok); }
.option.wrong { background: rgba(255,92,122,.25); border-color: var(--bad); }
.option:disabled { cursor: default; }
.feedback { margin-top: 14px; font-weight: 800; min-height: 26px; font-size: 1.05rem; }
.bar { height: 10px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin: 10px 0 14px; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), #7c5cff); transition: width .3s; }

.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 16px 0; }
.stat { background: rgba(255,255,255,.08); border-radius: 16px; padding: 14px; text-align: center; }
.stat b { display: block; font-size: 1.4rem; color: var(--gold); }
.result { text-align: center; padding: 18px 6px; }
.badge {
  display: inline-block; background: rgba(46,240,216,.18); color: var(--cyan);
  border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 800;

.hint {
  margin-top: 14px; font-size: .82rem; color: #d4c4f5;
  background: rgba(0,0,0,.18); border-radius: 12px; padding: 10px 12px; line-height: 1.5;
}
.footer-note { text-align: center; color: #a78bfa; font-size: .78rem; margin-top: 22px; line-height: 1.5; }
.progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: .93rem; gap: 8px; flex-wrap: wrap; }

/* Direction helpers */
[dir="rtl"] .option, [dir="rtl"] .mode { text-align: right; }
[dir="ltr"] .option, [dir="ltr"] .mode { text-align: left; }
[dir="ltr"] .logo { font-size: 1.7rem; }

@media (max-width: 500px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .logo { font-size: 1.5rem; }
}
</style>

  {id:65, section:{ar:"الحقوق والمسؤوليات",en:"Rights and Responsibilities"}, q:{ar:"ما هي ثلاثة حقوق لكل من يعيش في الولايات المتحدة؟",en:"What are three rights of everyone living in the United States?"}, options:{ar:["حرية التعبير / الكلام / التجمع / الدين / حق حمل السلاح","الحق في منزل مجاني / سيارة مجانية / طعام مجاني","حق التصويت فقط","لا حقوق لغير المواطنين"],en:["Freedom of expression / speech / assembly / religion / right to bear arms","Right to a free house / free car / free food","Only the right to vote","No rights for non-citizens"]}, correct:0, star:false},

  {id:67, section:{ar:"الحقوق والمسؤوليات",en:"Rights and Responsibilities"}, q:{ar:"اذكر وعدين يقطعهما المواطنون الجدد في قسم الولاء.",en:"Name two promises that new citizens make in the Oath of Allegiance."}, options:{ar:["التخلي عن الولاء لدول أخرى / الدفاع عن الدستور / طاعة القوانين / الخدمة في الجيش إذا لزم / الولاء للولايات المتحدة","عدم مغادرة الولايات المتحدة أبداً / عدم دفع الضرائب","دعم حزب سياسي واحد فقط","رفض الخدمة في هيئة المحلفين"],en:["Give up loyalty to other countries / Defend the Constitution / Obey the laws / Serve in the military if needed / Be loyal to the United States","Never leave the United States / Pay no taxes","Support only one political party","Refuse to serve on a jury"]}, correct:0, star:false},
  {id:68, section:{ar:"الحقوق والمسؤوليات",en:"Rights and Responsibilities"}, q:{ar:"كيف يمكن للناس أن يصبحوا مواطنين أمريكيين؟",en:"How can people become United States citizens?"}, options:{ar:["الولادة في الولايات المتحدة / التجنّس / اكتساب الجنسية","شراء الجنسية / الفوز في يانصيب فقط","فقط بالولادة لوالدين مواطنين","بالعيش سنة واحدة فقط"],en:["Be born in the United States / Naturalize / Derive citizenship","Buy citizenship / Win a lottery only","Only by being born to two citizen parents","By living in the U.S. for one year"]}, correct:0, star:false},

// ========== APP LOGIC ==========
let lang = "ar";
let mode = null;
let sectionFilter = null;
let quiz = null;

const $ = (s, el = document) => el.querySelector(s);
const app = document.getElementById("app");
const t = (key) => STR[lang][key] || key;

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  render();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestion(q) {
  const opts = q.options[lang].slice();
  const correctText = opts[0];
  const order = shuffle([0, 1, 2, 3]);
  return {
    id: q.id,
    section: q.section[lang],
    q: q.q[lang],
    options: order.map(i => opts[i]),
    correct: order.indexOf(0),
    star: q.star,
    correctText
  };
}

function startQuiz(selectedMode, section = null) {
  mode = selectedMode;
  sectionFilter = section;
  let pool = QUESTIONS.slice();
  if (selectedMode === "starred") pool = pool.filter(q => q.star);
  else if (selectedMode === "section" && section) pool = pool.filter(q => q.section.en === section || q.section.ar === section);

  let count = 10;
  if (selectedMode === "random20") count = 20;
  if (selectedMode === "starred") count = Math.min(10, pool.length);
  if (selectedMode === "full") count = pool.length;
  if (selectedMode === "section") count = Math.min(15, pool.length);

  quiz = {
    qs: shuffle(pool).slice(0, count).map(prepareQuestion),
    i: 0,
    score: 0,
    locked: false,
    answered: []
  };
  render();
}

function render() {
  if (!quiz) return renderHome();
  if (quiz.i >= quiz.qs.length) return renderResult();
  return renderQuiz();
}

  app.innerHTML = `

        <div class="hint">
          <strong>${t('note')}</strong>
          <a href="https://www.uscis.gov/citizenship/testupdates" target="_blank" style="color:var(--cyan);"> ${t('noteLink')}</a>
        </div>
        <p class="footer-note">${t('footer')}</p></br><p> Mohamed Abujamal</P>
      </div>
    </div>
  `;
  document.querySelectorAll(".lang-btn").forEach(b => b.onclick = () => setLang(b.dataset.l));
  document.querySelectorAll(".mode").forEach(el => {
    el.onclick = () => {
      const m = el.dataset.mode;
      if (m === "section") {
        $("#sectionPick").style.display = "block";
        const list = $("#sectionList");
        list.innerHTML = sections.map(s => `
          <div class="mode" data-section="${s}">
            <h3>${s}</h3>
            <p>${QUESTIONS.filter(q => q.section[lang] === s).length} ${lang==='ar'?'سؤالاً':'questions'}</p>
          </div>
        `).join("");
        list.querySelectorAll(".mode").forEach(sEl => {
          sEl.onclick = () => startQuiz("section", sEl.dataset.section);
        });
      } else {
        startQuiz(m);
      }
    };
  });
}

function renderQuiz() {
  const item = quiz.qs[quiz.i];
  const pct = Math.round((quiz.i / quiz.qs.length) * 100);
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">🇺🇸 ${t('title')}</div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <span class="badge">${quiz.score} ${t('correct')}</span>
        <button class="btn tiny ghost" id="quit" style="box-shadow:none; border-color:rgba(255,255,255,.3);">${t('exit')}</button>
      </div>
    </header>
    <main class="page">
      <div class="progress-info">
        <strong>${t('question')} ${quiz.i + 1} ${t('of')} ${quiz.qs.length}</strong>
        ${item.star ? `<span class="badge">${t('starred')}</span>` : ""}
      </div>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <div class="qcard">
        <div style="font-size:.8rem; color:#d4c4f5; margin-bottom:8px;">${item.section}</div>
        <h2>${item.q}</h2>
        <div class="options">
          ${item.options.map((opt, idx) => `<button class="option" data-i="${idx}">${opt}</button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    </main>
  `;
  $("#quit").onclick = () => {
    if (confirm(t('confirmExit'))) { quiz = null; render(); }
  };
  document.querySelectorAll(".option").forEach(btn => {
    btn.onclick = () => pick(+btn.dataset.i);
  });
}

function pick(idx) {
  if (quiz.locked) return;
  quiz.locked = true;
  const item = quiz.qs[quiz.i];
  const buttons = [...document.querySelectorAll(".option")];
  buttons.forEach(b => b.disabled = true);
  const fb = $("#fb");
  if (idx === item.correct) {
    buttons[idx].classList.add("correct");
    quiz.score++;
    fb.textContent = t('correctMsg');
    fb.style.color = "var(--ok)";
  } else {
    buttons[idx].classList.add("wrong");
    buttons[item.correct].classList.add("correct");
    fb.innerHTML = `${t('wrongMsg')}<br><small style="color:#d4c4f5">${item.correctText}</small>`;
    fb.style.color = "var(--gold)";
  }
  quiz.answered.push({ id: item.id, correct: idx === item.correct });
  setTimeout(() => { quiz.i++; quiz.locked = false; render(); }, 1100);
}

function renderResult() {
  const total = quiz.qs.length;
  const pct = Math.round((quiz.score / total) * 100);
  let pass = false, message = "";
  if (mode === "random20") {
    pass = quiz.score >= 12;
    message = pass ? t('passedSim') : t('needMore');
  } else if (mode === "starred") {
    pass = quiz.score >= 6;
    message = pass ? t('passed65') : t('need6');
  } else {
    pass = pct >= 70;
    message = pass ? t('greatJob') : t('reviewMissed');
  }
  const stars = pct >= 90 ? "★★★" : pct >= 70 ? "★★" : pct >= 50 ? "★" : "•";

  app.innerHTML = `
    <header class="topbar">
      <div class="brand">🇺🇸 ${t('title')}</div>
      <button class="btn tiny ghost" id="home" style="box-shadow:none; border-color:rgba(255,255,255,.3);">${t('home')}</button>
    </header>
    <main class="page">
      <div class="qcard result">
        <div style="font-size:2.5rem; margin-bottom:6px;">${pass ? "🎉" : "💪"}</div>
        <h2 style="font-size:1.5rem; margin-bottom:6px;">${pass ? t('wellDone') : t('keepGoing')}</h2>
        <div style="font-size:1.7rem; color:var(--gold); margin:8px 0;">${stars}</div>
        <p style="font-size:1.25rem; margin:10px 0;">${t('score')}: <strong>${quiz.score} / ${total}</strong> (${pct}%)</p>
        <p style="color:#d4c4f5; margin-bottom:16px;">${message}</p>
        <div class="stats">
          <div class="stat"><b>${quiz.score}</b>${t('correctCount')}</div>
          <div class="stat"><b>${total - quiz.score}</b>${t('missedCount')}</div>
          <div class="stat"><b>${pct}%</b>${t('accuracy')}</div>
        </div>
        <button class="btn ok" id="again">${t('tryAgain')}</button>
        <button class="btn sec" id="new">${t('differentMode')}</button>
        <button class="btn ghost" id="review">${t('reviewBtn')}</button>
      </div>
      <p class="footer-note">${t('footer')}</p>
    </main>
  `;
  $("#home").onclick = () => { quiz = null; render(); };
  $("#again").onclick = () => startQuiz(mode, sectionFilter);
  $("#new").onclick = () => { quiz = null; render(); };
  $("#review").onclick = () => renderReview();
}

function renderReview() {
  const missed = quiz.qs.filter((q, i) => !quiz.answered[i]?.correct);
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">🇺🇸 ${t('reviewTitle')}</div>
      <button class="btn tiny ghost" id="back" style="box-shadow:none; border-color:rgba(255,255,255,.3);">${t('back')}</button>
    </header>
    <main class="page">
      <h2 style="margin-bottom:16px;">${t('reviewTitle')} (${missed.length})</h2>
      ${missed.length === 0
        ? `<p style="color:var(--ok); font-weight:700;">${t('perfect')}</p>`
        : missed.map(q => `
          <div class="qcard" style="margin-bottom:14px;">
            <div style="font-size:.8rem; color:#d4c4f5; margin-bottom:6px;">${q.section} ${q.star ? "★" : ""}</div>
            <h3 style="font-size:1.08rem; margin-bottom:10px;">${q.q}</h3>
            <p style="color:var(--ok); font-weight:700;">✅ ${q.correctText}</p>
          </div>
        `).join("")
      }
      <button class="btn" id="done" style="margin-top:10px;">${t('done')}</button>
    </main>
  `;
  $("#back").onclick = $("#done").onclick = () => renderResult();
}

// Start in Arabic
setLang("ar");
</script>
</body>
</html>
